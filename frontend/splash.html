<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GeoTrust AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --pu: #a98bf5;
      --cr: #ebe3a6;
      --tx: #f4f4f5;
      --mu: #8f8f96;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Manrope', system-ui, sans-serif; }

    /* Aurora blobs */
    .bg-aurora { position: fixed; inset: 0; z-index: 0; }
    .aurora-blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0; animation: blob-appear 1.2s ease forwards; }
    .aurora-blob:nth-child(1) { width: 600px; height: 600px; background: radial-gradient(circle, #6c3fc5 0%, transparent 70%); top: -150px; left: -100px; animation-delay: 0.2s; }
    .aurora-blob:nth-child(2) { width: 500px; height: 500px; background: radial-gradient(circle, #a98bf5 0%, transparent 70%); bottom: -100px; right: -80px; animation-delay: 0.5s; }
    .aurora-blob:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, rgba(235,227,166,0.12) 0%, transparent 70%); top: 40%; left: 50%; transform: translateX(-50%); animation-delay: 0.8s; }
    @keyframes blob-appear { to { opacity: 1; } }

    /* Grid */
    .bg-grid { position: fixed; inset: 0; z-index: 1; background-image: linear-gradient(rgba(169,139,245,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(169,139,245,0.04) 1px, transparent 1px); background-size: 48px 48px; opacity: 0; animation: fade-in 1.5s ease forwards; }
    @keyframes fade-in { to { opacity: 1; } }

    /* Scan line */
    .scan-line { position: fixed; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(169,139,245,0.5), transparent); z-index: 20; top: 0; opacity: 0; animation: scan 2.5s ease-in-out 1.5s 1 forwards; }
    @keyframes scan { 0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    /* Particles */
    .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .particle { position: absolute; border-radius: 50%; opacity: 0; animation: float-particle linear infinite; }
    @keyframes float-particle { 0% { opacity: 0; transform: translateY(0) scale(0); } 10% { opacity: 0.6; transform: translateY(-20px) scale(1); } 90% { opacity: 0.3; } 100% { opacity: 0; transform: translateY(-120px) scale(0.5); } }

    /* Splash center */
    .splash { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 24px; }

    /* Logo */
    .logo-wrap { position: relative; width: 96px; height: 96px; margin-bottom: 36px; opacity: 0; transform: scale(0.6) translateY(20px); animation: logo-in 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards; }
    @keyframes logo-in { to { opacity: 1; transform: scale(1) translateY(0); } }
    .logo-wrap svg { width: 100%; height: 100%; }
    .orbit-ring { position: absolute; inset: -12px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: rgba(169,139,245,0.7); border-right-color: rgba(169,139,245,0.3); animation: orbit 3s linear infinite; }
    .orbit-ring-2 { position: absolute; inset: -22px; border-radius: 50%; border: 1px solid transparent; border-bottom-color: rgba(235,227,166,0.5); border-left-color: rgba(235,227,166,0.2); animation: orbit 5s linear infinite reverse; }
    @keyframes orbit { to { transform: rotate(360deg); } }

    /* Text animations */
    .line-in { opacity: 0; transform: translateY(16px); }
    .welcome-label { font-size: 12px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--pu); margin-bottom: 14px; animation: line-in 0.7s ease 0.9s forwards; }
    .main-title { font-size: clamp(40px,7vw,72px); font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; color: var(--tx); margin-bottom: 20px; animation: line-in 0.75s ease 1.1s forwards; }
    @keyframes line-in { to { opacity: 1; transform: translateY(0); } }
    .highlight { background: linear-gradient(135deg, #a98bf5 0%, #ebe3a6 60%, #a98bf5 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 3s linear 1.8s infinite; }
    @keyframes shimmer { to { background-position: 200% center; } }
    .sub-title { font-size: 15px; color: var(--mu); max-width: 440px; line-height: 1.6; margin-bottom: 52px; animation: line-in 0.7s ease 1.35s forwards; }

    /* Progress */
    .progress-wrap { width: 220px; height: 3px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; animation: line-in 0.5s ease 1.6s forwards; }
    .progress-bar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--pu), var(--cr)); animation: fill-bar 2.2s cubic-bezier(0.4,0,0.2,1) 1.8s forwards; }
    @keyframes fill-bar { 0% { width:0%; } 60% { width:75%; } 85% { width:92%; } 100% { width:100%; } }
    .loading-text { margin-top: 14px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mu); transition: opacity 0.4s ease; animation: line-in 0.5s ease 1.7s forwards; }

    /* Page fade-out */
    body.fade-out { animation: page-out 0.7s ease forwards; }
    @keyframes page-out { to { opacity: 0; transform: scale(1.03); } }
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div class="bg-aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div><div class="aurora-blob"></div></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>

  <div class="splash">
    <div class="logo-wrap">
      <div class="orbit-ring"></div>
      <div class="orbit-ring-2"></div>
      <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="48" cy="48" r="44" stroke="rgba(169,139,245,0.15)" stroke-width="1.5"/>
        <circle cx="48" cy="48" r="32" fill="rgba(169,139,245,0.08)" stroke="rgba(169,139,245,0.3)" stroke-width="1.5"/>
        <ellipse cx="48" cy="48" rx="16" ry="32" stroke="rgba(169,139,245,0.5)" stroke-width="1.5"/>
        <ellipse cx="48" cy="48" rx="32" ry="12" stroke="rgba(169,139,245,0.5)" stroke-width="1.5"/>
        <circle cx="48" cy="48" r="4" fill="#a98bf5"/>
        <circle cx="62" cy="34" r="5" fill="#ebe3a6"/>
        <line x1="62" y1="39" x2="62" y2="48" stroke="#ebe3a6" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M48 16 L56 20 L56 28 L48 32 L40 28 L40 20 Z" fill="rgba(169,139,245,0.2)" stroke="rgba(169,139,245,0.6)" stroke-width="1.5" stroke-linejoin="round"/>
        <polyline points="44,24 47,27 52,22" stroke="#a98bf5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="welcome-label line-in">Welcome to</div>
    <h1 class="main-title line-in"><span class="highlight">GeoTrust AI</span></h1>
    <p class="sub-title line-in">Geospatial Intelligence &amp; KYC Verification Platform.<br>Cross-referencing physical signals with financial claims in real time.</p>

    <div class="progress-wrap line-in">
      <div class="progress-bar"></div>
    </div>
    <div class="loading-text line-in" id="loadingText">Initializing secure session…</div>
  </div>

  <script>
    // Particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*4}s;background:${Math.random()>0.5?'#a98bf5':'#ebe3a6'};`;
      container.appendChild(p);
    }

    // Cycling status messages
    const messages = ['Initializing secure session…','Loading geospatial engine…','Preparing KYC modules…','Ready.'];
    let mi = 0;
    const lt = document.getElementById('loadingText');
    const iv = setInterval(() => {
      mi++;
      if (mi < messages.length) {
        lt.style.opacity = '0';
        setTimeout(() => { lt.textContent = messages[mi]; lt.style.opacity = '1'; }, 200);
      } else { clearInterval(iv); }
    }, 900);

    // Redirect after animation
    setTimeout(() => {
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'login.html'; }, 700);
    }, 4200);
  </script>
</body>
</html>
